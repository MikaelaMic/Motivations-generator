<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" sizes="32x32" href="./images/techover.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Techover - Motivations Generator</title>
  </head>
  <body>
    <div class="container">
      <div class="quote-container">
        <p class="advice-number">ADVICE #45</p>
        <p class="quote">"People who are good at what they do, find a way to tie it to revenue"</p>
        <div class="divider-container">
          <img src="pattern-divider-desktop.svg" alt="divider" class="divider">
        </div>
        <div class="quote-circle" id="new-advice-btn" title="Click for new advice">
         <img src="quotes.svg" alt="quotes" class="quotes">
        </div>
      </div>
    </div>
  </body>
<script src="index.js"></script>
</html>
